name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: build + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # One SDK builds every target framework: the .NET 10 SDK compiles net8.0, net9.0 and net10.0
      # alike, so the solution build already proves all three. A matrix of older SDKs would fail
      # outright — an SDK cannot build a framework newer than itself.
      #
      # The 9.0 runtime is installed separately because the test project multi-targets
      # net9.0;net10.0: .NET does not roll forward across major versions by default, so running the
      # net9.0 test target needs the 9.0 shared runtime present.
      - name: Setup .NET (10 SDK, 9 runtime)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      # setup-dotnet installs a matching SDK but does not decide which one MSBuild picks: with no
      # global.json the highest SDK in the install root wins. That is how this pipeline once
      # compiled on .NET 11 while the workflow said 9 — and how `dotnet pack` began failing with
      # NU5050 on a file that packs cleanly on 9. global.json is the pin; this step proves it held.
      - name: Verify the SDK matches global.json
        run: |
          pinned=$(jq -r '.sdk.version' global.json | cut -d. -f1)
          actual=$(dotnet --version)
          echo "global.json pins .NET ${pinned}; the build will use ${actual}"
          if [ "${actual%%.*}" != "${pinned}" ]; then
            echo "::error::Resolved SDK ${actual} does not match the major version pinned in global.json (${pinned}). Fix the image/setup-dotnet combination instead of editing global.json to whatever the runner happens to ship."
            exit 1
          fi

      - name: Restore
        run: dotnet restore Aneiang.Yarp.sln

      - name: Build (all target frameworks)
        run: dotnet build Aneiang.Yarp.sln --no-restore -c Release

      # Both targets explicitly: `dotnet test` on a multi-target project would otherwise pick one
      # and leave the other asset compiled but never executed — which is the half of "we support
      # net10.0" that a green build cannot prove.
      - name: Test (net9.0 and net10.0)
        run: |
          for tfm in net9.0 net10.0; do
            dotnet test tests/Aneiang.Yarp.UnitTests/Aneiang.Yarp.UnitTests.csproj \
              --no-build -c Release -f "$tfm" \
              --logger "trx;LogFileName=test-results-$tfm.trx" \
              --results-directory "TestResults/$tfm"
          done

      # Keeps the "quietly runs nothing" failure mode honest: a filter typo would otherwise
      # turn the suite green while it validates exactly zero behaviour.
      - name: Verify tests actually ran
        run: |
          total=$(grep -ho 'total="[0-9]*"' TestResults/*/*.trx | sed 's/[^0-9]//g' | awk '{ s += $1 } END { print s + 0 }')
          echo "Executed test cases: ${total:-0}"
          if [ -z "$total" ] || [ "$total" -lt 100 ]; then
            echo "::error::Expected at least 100 test cases, got '${total:-0}'."
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

  pack:
    name: pack (dry run)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # setup-dotnet installs a matching SDK but does not decide which one MSBuild picks: with no
      # global.json the highest SDK in the install root wins. That is how this pipeline once
      # compiled on .NET 11 while the workflow said 9 — and how `dotnet pack` began failing with
      # NU5050 on a file that packs cleanly on 9. global.json is the pin; this step proves it held.
      - name: Verify the SDK matches global.json
        run: |
          pinned=$(jq -r '.sdk.version' global.json | cut -d. -f1)
          actual=$(dotnet --version)
          echo "global.json pins .NET ${pinned}; the build will use ${actual}"
          if [ "${actual%%.*}" != "${pinned}" ]; then
            echo "::error::Resolved SDK ${actual} does not match the major version pinned in global.json (${pinned}). Fix the image/setup-dotnet combination instead of editing global.json to whatever the runner happens to ship."
            exit 1
          fi

      # Packing on every push catches the "works in the repo, ships without a file" class of
      # bug. The Grafana board is packaged from docs/, so a wrong <None Include> path is
      # invisible until someone installs the package.
      # Every project under src/ is packed rather than a hand-maintained list. The previous
      # version named only two projects, so a duplicate <None Include> anywhere else — the
      # NU5050 "logo.png packed twice" failure — passed this job and only surfaced on install.
      - name: Pack
        run: |
          for p in src/*/*.csproj; do
            if ! dotnet pack "$p" -c Release -o out --nologo; then
              # NU5050 names the destination but not the two sources that produced it. Dump the
              # inputs here so a duplicate is diagnosable from the log instead of guessed at.
              echo "::group::why $p failed"
              echo "--- tracked logo paths ---"
              git ls-files | grep -i 'logo\.png' || true
              echo "--- logo files on disk (case-sensitive on Linux) ---"
              find . -maxdepth 3 -iname 'logo.png' -not -path './.git/*' || true
              echo "--- package items mentioning logo ---"
              grep -rn "logo.png" src/*/obj/Release/*.nuspec 2>/dev/null | head -20 || true
              echo "::endgroup::"
              exit 1
            fi
          done

      - name: Verify the Grafana template is inside the package
        run: |
          pkg=$(ls out/Aneiang.Yarp.Dashboard.*.nupkg | head -1)
          echo "Inspecting $pkg"
          unzip -l "$pkg" | grep -q 'observability/grafana-dashboard.json' || {
            echo "::error::Grafana dashboard template is missing from $pkg"
            exit 1
          }
          unzip -l "$pkg" | sed -n '1,20p'

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: out/*.nupkg
          retention-days: 7

  deployables:
    name: deployables (templates + helm + docker)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # setup-dotnet installs a matching SDK but does not decide which one MSBuild picks: with no
      # global.json the highest SDK in the install root wins. That is how this pipeline once
      # compiled on .NET 11 while the workflow said 9 — and how `dotnet pack` began failing with
      # NU5050 on a file that packs cleanly on 9. global.json is the pin; this step proves it held.
      - name: Verify the SDK matches global.json
        run: |
          pinned=$(jq -r '.sdk.version' global.json | cut -d. -f1)
          actual=$(dotnet --version)
          echo "global.json pins .NET ${pinned}; the build will use ${actual}"
          if [ "${actual%%.*}" != "${pinned}" ]; then
            echo "::error::Resolved SDK ${actual} does not match the major version pinned in global.json (${pinned}). Fix the image/setup-dotnet combination instead of editing global.json to whatever the runner happens to ship."
            exit 1
          fi

      # The template references the published packages, so the only way to prove it is usable is to
      # pack this commit and restore from that feed. Pointing the template at nuget.org would test
      # whatever was published last, which is precisely not the thing that needs testing.
      #
      # Every project under src/ is packed rather than a hand-maintained list: the last version of
      # this list named a project that no longer existed, and a missing project fails the job with an
      # error that says nothing about templates.
      - name: Pack into a local feed
        run: |
          mkdir -p localfeed
          for p in src/*/*.csproj; do
            dotnet pack "$p" -c Release -o localfeed --nologo -v quiet
          done
          ls -1 localfeed | grep '\.nupkg$' | wc -l

      # A template package that installs but produces a project that does not compile is the standard
      # failure mode, and it only surfaces for the user. This step is the user.
      - name: Template instantiates and compiles
        run: |
          dotnet pack templates/Aneiang.Yarp.Templates/Aneiang.Yarp.Templates.csproj -c Release -o out --nologo -v quiet
          # Glob rather than a pinned filename: the template package carries its own version, and a
          # bump should not fail CI with a "file not found" that looks like a missing template.
          dotnet new install out/Aneiang.Yarp.Templates.*.nupkg
          mkdir -p tmpltest && cd tmpltest
          dotnet new aneiang-yarp -n GeneratedGateway --Framework net10.0
          # The heredoc body has to start in column 0 of the generated file, so these lines sit at the
          # same indentation as everything else in this block and YAML strips it uniformly.
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<configuration>' \
            '  <packageSources>' \
            '    <clear />' \
            '    <add key="local" value="../../localfeed" />' \
            '  </packageSources>' \
            '</configuration>' > GeneratedGateway/nuget.config
          dotnet build GeneratedGateway/GeneratedGateway.csproj -c Release --nologo
          # The Dockerfile ships with the project; a stale assembly name there is a broken image
          # that nobody notices until `docker run`.
          grep -q 'ENTRYPOINT \["dotnet", "GeneratedGateway.dll"\]' GeneratedGateway/Dockerfile
          # --Framework has to reach the csproj, not just the template's choice list: a choice that
          # renders nothing is the failure mode this assertion exists for.
          grep -q '<TargetFramework>net10.0</TargetFramework>' GeneratedGateway/GeneratedGateway.csproj

      # A plugin template fails differently from a gateway template: it compiles, then the host
      # refuses to load it because the manifest points at the wrong assembly or the wrong type.
      # So this step asserts the *rendered manifest*, not just that the build succeeded.
      - name: Plugin template builds a loadable manifest
        run: |
          cd tmpltest
          dotnet new aneiang-yarp-plugin -n DemoPlugin --PluginId demo-plugin --Framework net9.0
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<configuration>' \
            '  <packageSources>' \
            '    <clear />' \
            '    <add key="local" value="../../localfeed" />' \
            '  </packageSources>' \
            '</configuration>' > DemoPlugin/nuget.config
          dotnet publish DemoPlugin/DemoPlugin.csproj -c Release -o DemoPlugin/out --nologo
          # The contract assembly must NOT be in the plugin folder: the host resolves it to its own
          # copy, and a second one produces two IGatewayPlugin types that are not the same type.
          test ! -f DemoPlugin/out/Aneiang.Yarp.Plugin.Abstractions.dll
          # Identity fields are rendered from MSBuild properties; these three are the ones that
          # break silently when a project is renamed.
          grep -q '"id": "demo-plugin"' DemoPlugin/out/plugin.json
          grep -q '"entryAssembly": "DemoPlugin.dll"' DemoPlugin/out/plugin.json
          grep -q '"entryType": "DemoPlugin.DemoPluginEntry"' DemoPlugin/out/plugin.json
          grep -q '"capabilities": \[ "ProxyPipeline" \]' DemoPlugin/out/plugin.json

      # `helm lint` catches the class of bug that only shows up at install time on a cluster:
      # an unclosed template, a value referenced with the wrong case, a required field that is
      # only required sometimes.
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Helm lint and render
        run: |
          helm lint deploy/helm/aneiang-yarp
          helm template gw deploy/helm/aneiang-yarp --namespace gateway > rendered.yaml
          for kind in Deployment Service ConfigMap Secret PersistentVolumeClaim ServiceAccount; do
            grep -q "kind: $kind" rendered.yaml || { echo "::error::$kind is missing from the rendered chart"; exit 1; }
          done
          helm template gw deploy/helm/aneiang-yarp \
            --set ingress.enabled=true --set grpc.enabled=false --set persistence.enabled=false \
            --set auth.mode=None > rendered-minimal.yaml
          # The guard is a feature: two replicas over one SQLite file is the silent-inconsistency
          # bug ADR-001 exists to prevent, so the chart must refuse rather than warn.
          if helm template gw deploy/helm/aneiang-yarp --set replicaCount=2 > /dev/null 2>&1; then
            echo "::error::The chart rendered with replicaCount=2 and no allowMultipleReplicas — the guard is broken"
            exit 1
          fi
          helm template gw deploy/helm/aneiang-yarp --set replicaCount=2 --set allowMultipleReplicas=true \
            --set persistence.accessMode=ReadWriteMany > /dev/null

      # The image is built, not shipped: `docker build` is the only check that proves the COPY
      # paths in the Dockerfile still match the repository layout.
      - name: Docker build (no push)
        run: docker build -f deploy/docker/Dockerfile -t aneiang/yarp-gateway:ci .

