{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "aneiang-yarp.pvcName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aneiang-yarp.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.persistence.keepOnDelete }}
    # The claim holds every route, cluster, snapshot and audit record this gateway ever had.
    # `helm uninstall` is a routine command; losing the configuration must not be one of its effects.
    helm.sh/resource-policy: keep
    {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
