{{- include "aneiang-yarp.validate" . -}}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aneiang-yarp.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aneiang-yarp.labels" . | nindent 4 }}
  annotations:
    # Credentials must survive `helm uninstall` of the release. Regenerating a JWT secret orphans
    # every session, and regenerating the password locks the operator out of a gateway whose routes
    # are still in the (kept) volume.
    helm.sh/resource-policy: keep
type: Opaque
data:
  jwt-password: {{ include "aneiang-yarp.jwtPassword" . }}
  jwt-secret: {{ include "aneiang-yarp.jwtSecret" . }}
{{- end }}
