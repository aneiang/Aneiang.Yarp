{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aneiang-yarp.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aneiang-yarp.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The gateway reads its routes from its own store, not from the Kubernetes API. No token is mounted:
# a credential that is never used is still a credential that can leak from a crashed process.
automountServiceAccountToken: false
{{- end }}
