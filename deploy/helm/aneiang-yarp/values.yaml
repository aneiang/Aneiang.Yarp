# Defaults are "it works, and it is honest about what it is".
#
# The one thing to read before scaling: this chart runs ONE replica by default, and that is not
# timidity. The config store is a single SQLite file, so two replicas are two divergent copies of
# the routes — exactly the silent inconsistency ADR-001 exists to prevent. See `allowMultipleReplicas`.

image:
  repository: aneiang/yarp-gateway
  # Defaults to the chart's appVersion when left empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Keep at 1 unless you have read ADR-001 and decided otherwise. See `allowMultipleReplicas`.
replicaCount: 1

# Escape hatch for the guard above. Setting this to true lets the deployment render with more than
# one replica, and the pods will each keep their own SQLite file. Only correct when the store is
# shared through a ReadWriteMany claim AND you accept last-write-wins between control planes.
allowMultipleReplicas: false

# ── gateway configuration ────────────────────────────────────────────────────────
# Rendered verbatim into appsettings.json. Anything here can also be overridden per-deployment with
# `extraEnv` using the Gateway__A__B convention — env wins, and that is how the auth secrets below
# are injected without ever landing in a ConfigMap.
config:
  Logging:
    LogLevel:
      Default: Information
      Microsoft.AspNetCore: Warning
      Yarp.ReverseProxy: Warning

  Gateway:
    Dashboard:
      RoutePrefix: aneiang
    # Sibling of Dashboard, not a child: Deployment decides which endpoints exist and which role this
    # process plays (AllInOne / Split / ProxyOnly), and the dashboard is only one of those endpoints.
    Deployment:
      Mode: AllInOne
      HealthCheck:
        Enabled: true
      HotReload:
        Enabled: true
    Storage:
      Provider: Sqlite
      Sqlite:
        # The path is absolute because the store directory is the only writable place in the
        # container. A relative path would resolve next to the read-only binary and fail on first save.
        ConnectionString: Data Source=/app/data/gateway-store.db

  Kestrel:
    Endpoints:
      Gateway:
        Url: http://0.0.0.0:5200
      Grpc:
        Url: http://0.0.0.0:5201
        Protocols: Http2

# ── authentication ──────────────────────────────────────────────────────────────
# Never leave the default password in a chart you install anywhere reachable. Either set a real one
# here (it goes into a Secret, not the ConfigMap) or bring your own Secret.
auth:
  # DefaultJwt / CustomJwt / ApiKey / None
  mode: DefaultJwt
  # Only used by CustomJwt. Harmless when empty.
  username: admin
  # Required unless existingSecret is set. `helm install` generates a random one when left empty,
  # which is friendlier than shipping a known password and hoping someone reads the notes.
  jwtPassword: ""
  # Signing key. Generated on install when empty; changing it invalidates every issued token.
  jwtSecret: ""
  # Accounts and roles (see ADR-004). When empty the single account above is used as admin.
  #   users:
  #     - username: alice
  #       password: "..."
  #       role: admin
  #     - username: carol
  #       password: "..."
  #       role: viewer
  users: []
  # Use an existing Secret instead of the generated one. It must provide the same keys the chart
  # writes: jwt-password, jwt-secret, and tls.crt/tls.key only when ingress.tls is enabled by secretName.
  existingSecret: ""

# ── persistence ─────────────────────────────────────────────────────────────────
# Routes, clusters, snapshots, audit log and history live here. Without a claim they live in the pod
# and disappear with it — fine for a demo, never fine for a gateway.
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  accessMode: ReadWriteOnce
  existingClaim: ""
  # Keep the claim when the release is uninstalled. Deleting a PVC deletes every route you ever
  # configured, and `helm uninstall` is not supposed to be that kind of command.
  keepOnDelete: true

# ── networking ─────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 5200
  annotations: {}

# gRPC listener for client self-registration. Separate Service because it needs appProtocol h2c and
# HTTP/2 end-to-end; folding it into the gateway Service makes ingress controllers downgrade the
# gateway traffic to HTTP/1.1 as well.
grpc:
  enabled: true
  port: 5201
  type: ClusterIP

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: gateway.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ── scheduling & resources ─────────────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 512Mi

# The container runs as a non-root user created in the image (uid 10001).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Probes reuse the gateway port: the dashboard and the admin API are served under the same port as
# proxied traffic, so there is no separate management port to point at.

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}

# Extra environment variables. This is the escape hatch for anything not modelled above, and the
# only place to put secrets the chart does not know about.
extraEnv: []
#  - name: AI__ApiKey
#    valueFrom:
#      secretKeyRef:
#        name: ai-credentials
#        key: api-key

serviceAccount:
  create: true
  annotations: {}
  name: ""
